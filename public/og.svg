<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Mis Recursos WEB DEV</title>
  <desc id="desc">Colección de herramientas, recursos, guías e inspiración para desarrollo web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="100%" stop-color="#14101f"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#CD9E4B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CD9E4B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6d58b"/>
      <stop offset="55%" stop-color="#CD9E4B"/>
      <stop offset="100%" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2033"/>
      <stop offset="100%" stop-color="#10121d"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CD9E4B"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="380" fill="url(#glowViolet)"/>
  <circle cx="160" cy="620" r="360" fill="url(#glowGold)"/>
  <circle cx="900" cy="560" r="260" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Franja diagonal -->
  <polygon points="0,540 1200,360 1200,380 0,560" fill="url(#gold)" opacity="0.10"/>

  <!-- Logo -->
  <g transform="translate(72,64)">
    <rect width="76" height="76" rx="20" fill="url(#gold)"/>
    <rect width="76" height="76" rx="20" fill="none" stroke="#fff" stroke-opacity="0.35"/>
    <text x="38" y="54" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="44" font-weight="800" fill="#0b0d14">W</text>
  </g>
  <text x="168" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#22d3ee">&lt;/&gt; dev.resources</text>

  <!-- Título -->
  <text x="72" y="268" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="68" font-weight="700" fill="#f1f3fa">Mis Recursos</text>
  <text x="68" y="368" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="112" font-weight="900" fill="url(#gold)" letter-spacing="-2">WEB DEV</text>

  <!-- Subtítulo -->
  <text x="72" y="428" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="27" fill="#b4b8cc">Herramientas, recursos, guías e inspiración</text>
  <text x="72" y="468" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="27" fill="#b4b8cc">para desarrollo web.</text>

  <!-- URL -->
  <rect x="72" y="520" width="484" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="url(#stroke)" stroke-width="2"/>
  <circle cx="102" cy="548" r="7" fill="#4ade80"/>
  <text x="122" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#e3e6ef">mis-recursos-webdev.pages.dev</text>

  <!-- Ventana de código inclinada -->
  <g transform="rotate(-6 880 330)" filter="url(#shadow)">
    <rect x="690" y="150" width="400" height="300" rx="20" fill="url(#win)" stroke="url(#stroke)" stroke-width="2"/>
    <rect x="690" y="150" width="400" height="46" rx="20" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="718" cy="173" r="7" fill="#ff5f57"/>
    <circle cx="742" cy="173" r="7" fill="#febc2e"/>
    <circle cx="766" cy="173" r="7" fill="#28c840"/>
    <!-- líneas de código -->
    <rect x="718" y="222" width="70" height="12" rx="6" fill="#ff7ab6"/>
    <rect x="798" y="222" width="120" height="12" rx="6" fill="#22d3ee"/>
    <rect x="742" y="254" width="90" height="12" rx="6" fill="#CD9E4B"/>
    <rect x="842" y="254" width="160" height="12" rx="6" fill="#9a8cff"/>
    <rect x="742" y="286" width="140" height="12" rx="6" fill="#4ade80"/>
    <rect x="892" y="286" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="742" y="318" width="60" height="12" rx="6" fill="#ff7ab6"/>
    <rect x="812" y="318" width="170" height="12" rx="6" fill="#22d3ee"/>
    <rect x="718" y="350" width="110" height="12" rx="6" fill="#CD9E4B"/>
    <rect x="718" y="382" width="190" height="12" rx="6" fill="#9a8cff" fill-opacity="0.8"/>
    <rect x="918" y="382" width="50" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <!-- cursor -->
    <rect x="718" y="410" width="12" height="20" fill="#CD9E4B"/>
  </g>

  <!-- Chips flotantes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">
    <g transform="rotate(8 1040 92)">
      <rect x="980" y="64" width="120" height="56" rx="16" fill="#ff7a45"/>
      <text x="1040" y="101" text-anchor="middle" fill="#0b0d14">HTML</text>
    </g>
    <g transform="rotate(-8 780 120)">
      <rect x="716" y="94" width="104" height="52" rx="16" fill="#38bdf8"/>
      <text x="768" y="128" text-anchor="middle" fill="#0b0d14">CSS</text>
    </g>
    <g transform="rotate(7 1090 500)">
      <rect x="1040" y="474" width="92" height="52" rx="16" fill="#facc15"/>
      <text x="1086" y="508" text-anchor="middle" fill="#0b0d14">JS</text>
    </g>
    <g transform="rotate(-6 760 520)">
      <rect x="690" y="494" width="140" height="52" rx="16" fill="#a78bfa"/>
      <text x="760" y="528" text-anchor="middle" fill="#0b0d14">UI/UX</text>
    </g>
  </g>

  <!-- Detalles decorativos -->
  <g fill="#CD9E4B">
    <circle cx="640" cy="70" r="5"/>
    <circle cx="1150" cy="300" r="4" fill="#22d3ee"/>
    <circle cx="620" cy="590" r="4" fill="#ff7ab6"/>
    <path d="M1130 190 l8 -18 l8 18 l-18 -8 h20z" fill="#22d3ee" opacity="0.8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
